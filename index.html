<div id="twt-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>阅读</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content" style="display: none;">
            <div class="twt-tabs"
                style="display: flex; border-bottom: 1px solid var(--SmartThemeBorderColor); margin-bottom: 10px;">
                <div class="twt-tab active" data-tab="twt-tab-settings"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6;">设置</div>
                <div class="twt-tab" id="tab-btn-page" data-tab="twt-tab-page"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6; display: none;">翻页</div>
                <div class="twt-tab" id="tab-btn-menu" data-tab="twt-tab-menu"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6; display: none;">菜单</div>
                <div class="twt-tab" id="tab-btn-visual" data-tab="twt-tab-visual"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6; display: none;">视觉</div>
                <div class="twt-tab" id="tab-btn-mulu" data-tab="twt-tab-mulu"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6; display: none;">目录</div>
                <div class="twt-tab" id="tab-btn-optimize" data-tab="twt-tab-optimize"
                    style="padding: 5px 10px; cursor: pointer; opacity: 0.6; display: none;">优化</div>
            </div>

            <style>
                .twt-tab.active {
                    opacity: 1;
                    border-bottom: 2px solid var(--SmartThemeBlurTintColor);
                    font-weight: bold;
                }
            </style>

            <div class="twt-tab-content active" id="twt-tab-settings">
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_enabled">启用阅读翻页模式</label>
                    <input type="checkbox" id="twt_enabled" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_menu_enabled">启用消息操作菜单</label>
                    <input type="checkbox" id="twt_menu_enabled" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_visual_enabled">启用阅读视觉设置</label>
                    <input type="checkbox" id="twt_visual_enabled" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_mulu_enabled">启用目录设置</label>
                    <input type="checkbox" id="twt_mulu_enabled" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_optimize_enabled">启用酒馆主题优化</label>
                    <input type="checkbox" id="twt_optimize_enabled" />
                </div>
            </div>

            <!-- 翻页 Tab -->
            <div class="twt-tab-content" id="twt-tab-page" style="display: none;">
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                    <label for="twt_swipe_enabled">启用滑动翻页</label>
                    <input type="checkbox" id="twt_swipe_enabled" />
                </div>
                <div style="font-size: 0.85em; opacity: 0.6; margin-bottom: 15px; margin-top: -2px; padding-left: 2px;">
                    若启用，需手动在用户设置中关闭手势滑动(swipe)，以避免冲突。
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                    <label for="twt_message_page_enabled">启用消息分页</label>
                    <input type="checkbox" id="twt_message_page_enabled" />
                </div>
                <div style="font-size: 0.85em; opacity: 0.6; margin-bottom: 15px; margin-top: -2px; padding-left: 2px;">
                    开启后，每条消息将单独占一页，新消息另起一页。
                </div>
                
                <div style="border-top: 1px dashed var(--SmartThemeBorderColor); padding-top: 10px; margin-top: 10px;">
                    <div class="twt-setting-row" style="display: flex; flex-direction: column; margin-bottom: 5px;">
                        <label for="twt_custom_whitelist" style="margin-bottom: 5px; font-size: 0.95em;">防误触类名/选择器白名单 (用逗号分隔)</label>
                        <input type="text" id="twt_custom_whitelist" placeholder="例如：.mes_reasoning_details, .thought-block" style="width: 100%; box-sizing: border-box; padding: 6px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                    </div>
                    <div style="font-size: 0.85em; opacity: 0.6; padding-left: 2px;">
                        * 提示：点击白名单内的选择器（如类名、ID等）对应的元素及其子元素，不会触发点击翻页。
                    </div>
                </div>
            </div>

            <!-- 菜单 Tab -->
            <div class="twt-tab-content" id="twt-tab-menu" style="display: none;">
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: nowrap;">
                    <label for="twt_menu_invoke_method" style="white-space: nowrap; margin-right: 10px; flex-shrink: 0;">召出方式</label>
                    <select id="twt_menu_invoke_method"
                        style="background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px; flex-shrink: 1;">
                        <option value="longpress">长按</option>
                    </select>
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: nowrap;">
                    <label for="twt_menu_direction" style="white-space: nowrap; margin-right: 10px; flex-shrink: 0;">弹出方向</label>
                    <select id="twt_menu_direction"
                        style="background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px; flex-shrink: 1;">
                        <option value="top-left">左上</option>
                        <option value="top-right">右上</option>
                        <option value="bottom-left">左下</option>
                        <option value="bottom-right">右下</option>
                    </select>
                </div>
                <div class="twt-setting-row" id="twt_menu_longpress_delay_row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                    <label for="twt_menu_longpress_delay">长按时间 (毫秒)</label>
                    <input type="number" id="twt_menu_longpress_delay" min="100" max="3000" step="50"
                        style="width: 80px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px; text-align: center;" />
                </div>

                <div style="border-top: 1px dashed var(--SmartThemeBorderColor); margin-top: 10px; padding-top: 10px; margin-bottom: 10px;">
                    <span style="font-weight: bold; font-size: 0.95em;">菜单功能开关</span>
                </div>
                
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_regenerate">重新生成 (仅最新AI消息)</label>
                    <input type="checkbox" id="twt_menu_opt_regenerate" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_swipe">滑动 (仅最新AI消息)</label>
                    <input type="checkbox" id="twt_menu_opt_swipe" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_delete">删除 (暂未实现)</label>
                    <input type="checkbox" id="twt_menu_opt_delete" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_hide">隐藏 (暂未实现)</label>
                    <input type="checkbox" id="twt_menu_opt_hide" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_edit">分段编辑</label>
                    <input type="checkbox" id="twt_menu_opt_edit" />
                </div>
                <div id="twt_paragraph_edit_sub_options" style="display: none; padding-left: 15px; border-left: 2px solid var(--SmartThemeBorderColor); margin-bottom: 8px; margin-left: 5px;">
                    <div class="twt-setting-row" id="twt_paragraph_toolbar_bottom_row"
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                        <label for="twt_paragraph_toolbar_bottom">分段工具栏距底部高度 (px)</label>
                        <input type="number" id="twt_paragraph_toolbar_bottom" min="0" max="600" step="5"
                            style="width: 80px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px; text-align: center;" />
                    </div>
                    <div class="twt-setting-row" id="twt_paragraph_icon_size_row"
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                        <label for="twt_paragraph_icon_size">分段工具栏图标大小 (px)</label>
                        <input type="number" id="twt_paragraph_icon_size" min="10" max="100" step="1"
                            style="width: 80px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px; text-align: center;" />
                    </div>
                    <div class="twt-setting-row" id="twt_menu_opt_edit_filtered_row"
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                        <label for="twt_menu_opt_edit_filtered">分段编辑应用正则过滤 (只显示用户可见文本)</label>
                        <input type="checkbox" id="twt_menu_opt_edit_filtered" />
                    </div>
                    <div class="twt-setting-row" id="twt_paragraph_xml_whitelist_row"
                        style="display: flex; flex-direction: column; margin-bottom: 8px; align-items: flex-start;">
                        <label for="twt_paragraph_xml_whitelist" style="margin-bottom: 5px; font-size: 0.95em;">分段编辑 XML 标签白名单 (逗号分隔)</label>
                        <input type="text" id="twt_paragraph_xml_whitelist" placeholder="例如：thought, TavernThought, reasoning, details"
                            style="width: 100%; box-sizing: border-box; padding: 6px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                    </div>
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <label for="twt_menu_opt_excerpt">摘抄 (暂未实现)</label>
                    <input type="checkbox" id="twt_menu_opt_excerpt" />
                </div>
            </div>

            <div class="twt-tab-content" id="twt-tab-visual" style="display: none;">
                <!-- 预设管理 -->
                <div
                    style="border-bottom: 1px dashed var(--SmartThemeBorderColor); padding-bottom: 8px; margin-bottom: 8px;">
                    <div class="twt-setting-row"
                        style="display: flex; align-items: center; justify-content: space-between;">
                        <select id="twt_visual_preset"
                            style="flex: 1; margin-right: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px;"></select>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <button id="twt_preset_save" class="menu_button" style="padding: 4px 8px; margin: 0;"
                                title="保存/覆盖预设"><i class="fa-solid fa-floppy-disk"></i></button>
                            <button id="twt_preset_rename" class="menu_button" style="padding: 4px 8px; margin: 0;"
                                title="重命名预设"><i class="fa-solid fa-pen"></i></button>
                            <button id="twt_preset_delete" class="menu_button"
                                style="padding: 4px 8px; margin: 0; color: #ff4444;" title="删除预设"><i
                                    class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <!-- ── 页面边距 ── -->
                <div style="font-weight: bold; font-size: 0.9em; opacity: 0.7; margin-bottom: 8px;">页面边距</div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_padding_top">顶部留白 (px)</label>
                    <input type="number" id="twt_padding_top" placeholder="0"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_padding_bottom">底部留白 (px)</label>
                    <input type="number" id="twt_padding_bottom" placeholder="60"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_padding_left">左边距 (px)</label>
                    <input type="number" id="twt_padding_left" placeholder="15"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_padding_right">右边距 (px)</label>
                    <input type="number" id="twt_padding_right" placeholder="15"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <!-- ── 文本排版 ── -->
                <div style="border-top: 1px dashed var(--SmartThemeBorderColor); padding-top: 10px; margin-top: 4px; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; opacity: 0.7;">文本排版</div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_font_size">阅读字号 (px)</label>
                    <input type="number" id="twt_font_size" placeholder="16"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_line_height">行高</label>
                    <input type="number" id="twt_line_height" placeholder="1.6" step="0.1"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_text_indent">首行缩进 (字符数)</label>
                    <input type="number" id="twt_text_indent" placeholder="0" min="0" step="1"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_text_align">对齐方式</label>
                    <select id="twt_text_align"
                        style="width: 100px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 5px;">
                        <option value="left">左对齐</option>
                        <option value="justify">两端对齐</option>
                        <option value="center">居中</option>
                        <option value="right">右对齐</option>
                    </select>
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_paragraph_spacing">段落间距 (px)</label>
                    <input type="number" id="twt_paragraph_spacing" placeholder="0" step="1"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>

                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_letter_spacing">字间距 (px)</label>
                    <input type="number" id="twt_letter_spacing" placeholder="0" step="0.5"
                        style="width: 80px; text-align: center; box-sizing: border-box; padding: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                </div>
            </div>

            <!-- 目录 Tab -->
            <div class="twt-tab-content" id="twt-tab-mulu" style="display: none;">
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_mulu_btn_start">显示“回到开头”按钮 (左箭头)</label>
                    <input type="checkbox" id="twt_mulu_btn_start" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                    <label for="twt_mulu_btn_toc">显示“阅读目录”按钮 (书本)</label>
                    <input type="checkbox" id="twt_mulu_btn_toc" />
                </div>
                <div class="twt-setting-row"
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                    <label for="twt_mulu_btn_end">显示“回到结尾”按钮 (右箭头)</label>
                    <input type="checkbox" id="twt_mulu_btn_end" />
                </div>

                <!-- 正则设置段落 -->
                <div style="border-top: 1px dashed var(--SmartThemeBorderColor); padding-top: 15px; margin-top: 15px;">
                    <div style="font-weight: bold; margin-bottom: 10px;">目录正则设置 (自动提取章节)</div>

                    <div class="twt-setting-row"
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;">
                        <select id="twt_mulu_regex_preset"
                            style="flex: 1; margin-right: 5px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px; padding: 4px;">
                        </select>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <button id="twt_mulu_regex_save" class="menu_button" style="padding: 4px 8px; margin: 0;"
                                title="保存/覆盖正则预设"><i class="fa-solid fa-floppy-disk"></i></button>
                            <button id="twt_mulu_regex_rename" class="menu_button" style="padding: 4px 8px; margin: 0;"
                                title="重命名正则预设"><i class="fa-solid fa-pen"></i></button>
                            <button id="twt_mulu_regex_delete" class="menu_button"
                                style="padding: 4px 8px; margin: 0; color: #ff4444;" title="删除正则预设"><i
                                    class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>

                    <div class="twt-setting-row" style="display: flex; flex-direction: column; margin-bottom: 10px;">
                        <label for="twt_mulu_regex_input"
                            style="margin-bottom: 5px; font-size: 0.9em; opacity: 0.8;">正则表达式匹配 (为空则显示消息前十几个字)</label>
                        <input type="text" id="twt_mulu_regex_input" placeholder="例如：第[一二三四五六七八九十百\d]+章"
                            style="width: 100%; box-sizing: border-box; padding: 6px; background: var(--SmartThemeDarkColor); color: var(--SmartThemeBodyColor); border: 1px solid var(--SmartThemeBorderColor); border-radius: 4px;" />
                    </div>
                </div>
            </div>

            <!-- 优化 Tab -->
            <div class="twt-tab-content" id="twt-tab-optimize" style="display: none;">
                <!-- 头部控制栏：新建按钮 -->
                <div
                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--SmartThemeBorderColor); padding-bottom: 8px;">
                    <span style="font-weight: bold;">自定义优化补丁</span>
                    <button id="twt_optimize_add" class="menu_button"
                        style="padding: 4px 10px; margin: 0; font-size: 0.85em;" title="新建CSS补丁"><i
                            class="fa-solid fa-plus"></i></button>
                </div>

                <!-- 补丁列表容器 -->
                <div id="twt_optimize_list"
                    style="max-height: 250px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;">
                    <!-- 动态生成列表项 -->
                </div>

                <!-- 实时 CSS 编辑框区 (默认隐藏) -->
                <div id="twt_optimize_editor_container"
                    style="display: none; border-top: 1px dashed var(--SmartThemeBorderColor); padding-top: 10px; margin-top: 10px; flex-direction: column;">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px;">
                        <span id="twt_optimize_editor_title"
                            style="font-size: 0.9em; font-weight: bold; opacity: 0.9;">正在编辑: 未知补丁</span>
                        <button id="twt_optimize_close_editor" class="menu_button"
                            style="padding: 2px 6px; margin: 0; font-size: 0.8em;" title="关闭编辑器"><i
                                class="fa-solid fa-xmark"></i></button>
                    </div>
                    <textarea id="twt_optimize_code"
                        placeholder="输入自定义的 CSS 代码，例如：&#10;.mes_text { font-family: 'Outfit'; }"
